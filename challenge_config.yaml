# ── EvalAI Challenge Configuration ──────────────────────────────────
# Blocksworld LLM Planning Challenge
title: 基于大语言模型的 Blocksworld 任务规划实验
short_description: |
  使用大语言模型完成经典 Blocksworld 积木世界自动规划任务。
  包含纯 LLM Prompt 规划和 LLM + PDDL 规划两种方法路线。
description: templates/description.html
evaluation_details: templates/evaluation_details.html
terms_and_conditions: templates/terms_and_conditions.html
submission_guidelines: templates/submission_guidelines.html

image: logo.jpg

# ── 日期 ────────────────────────────────────────────────────────────
start_date: "2026-06-01T00:00:00"
end_date: "2026-08-31T23:59:59"

# ── 评测脚本 ────────────────────────────────────────────────────────
evaluation_script: evaluation_script

# ── 排行榜 ──────────────────────────────────────────────────────────
leaderboard:
  - id: 1
    schema:
      default_order_by: machine_total
      labels:
        - machine_total
        - q1_goal_success_rate
        - q2_goal_success_rate
        - q1_score
        - q2_score
        - q1_plan_valid_rate
        - q2_plan_valid_rate
        - q1_errors
        - q2_errors
        - q1_total_time_s
        - q2_total_time_s

# ── 指标定义 ────────────────────────────────────────────────────────
leaderboard_metrics:
  - name: machine_total
    description: 机器评分总分（55分=Q1 25+Q2 30）
    sort_ascending: false
  - name: q1_goal_success_rate
    description: Q1 目标达成率
    sort_ascending: false
  - name: q2_goal_success_rate
    description: Q2 目标达成率
    sort_ascending: false
  - name: q1_score
    description: Q1 得分（满分25）
    sort_ascending: false
  - name: q2_score
    description: Q2 得分（满分30）
    sort_ascending: false
  - name: q1_plan_valid_rate
    description: Q1 计划有效率
    sort_ascending: false
  - name: q2_plan_valid_rate
    description: Q2 计划有效率
    sort_ascending: false
  - name: q1_errors
    description: Q1 出错任务数
    sort_ascending: true
  - name: q2_errors
    description: Q2 出错任务数
    sort_ascending: true
  - name: q1_total_time_s
    description: Q1 总耗时（秒）
    sort_ascending: true
  - name: q2_total_time_s
    description: Q2 总耗时（秒）
    sort_ascending: true

# ── 阶段 ────────────────────────────────────────────────────────────
challenge_phases:
  - id: 1
    name: 评测阶段
    description: 在 21 个隐藏任务上评测 Q1 和 Q2
    start_date: "2026-06-01T00:00:00"
    end_date: "2026-08-31T23:59:59"
    max_submissions_per_day: 10
    max_submissions: 100
    is_public: true
    codename: test
    test_annotation_file: ""

# ── 数据集拆分 ──────────────────────────────────────────────────────
dataset_splits:
  - codename: test_split
    name: Test Split

# ── 阶段-拆分映射 ──────────────────────────────────────────────────
phase_split_mappings:
  - challenge_phase_id: 1
    dataset_split_codename: test_split
    leaderboard_id: 1
    visibility: public
    execution_time_limit_sec: 3600

# ── 提交配置 ────────────────────────────────────────────────────────
submission_meta_attributes:
  - name: method_name
    description: 方法名称
    type: text
    is_required: true
  - name: method_description
    description: 方法简介
    type: text
    is_required: true
  - name: project_url
    description: 项目链接
    type: text
    is_required: false
  - name: publication_url
    description: 论文链接
    type: text
    is_required: false

allowed_submission_file_types: "zip"
