title: Blocksworld LLM Planning Challenge
short_description: Solve classic Blocksworld planning tasks using LLMs - pure LLM prompt planning and LLM plus PDDL planner.
description: templates/description.html
evaluation_details: templates/evaluation_details.html
terms_and_conditions: templates/terms_and_conditions.html
image: logo.jpg
submission_guidelines: templates/submission_guidelines.html
category: [Education, Environment]
leaderboard_description: 排行榜展示 Q1（纯 LLM Prompt）和 Q2（LLM + PDDL）在 21 个隐藏任务上的测评结果。machine_total 为 Q1(25分) + Q2(30分) 的总分。
evaluation_script: evaluation_script.zip
remote_evaluation: False
start_date: 2026-06-01 00:00:00
end_date: 2027-12-31 23:59:59
published: True
tags:
  - blocksworld
  - llm
  - planning
  - pddl
leaderboard:
  - id: 1
    schema:
      {
        "labels": ["machine_total", "q1_score", "q2_score", "q1_goal_success_rate", "q2_goal_success_rate"],
        "default_order_by": "machine_total",
        "metadata": {
          "machine_total": {
            "sort_ascending": False,
            "description": "机器评分总分（满分55分 = Q1 25分 + Q2 30分）"
          },
          "q1_score": {
            "sort_ascending": False,
            "description": "Q1 纯 LLM Prompt 规划得分（满分25分）"
          },
          "q2_score": {
            "sort_ascending": False,
            "description": "Q2 LLM+PDDL 规划得分（满分30分）"
          },
          "q1_goal_success_rate": {
            "sort_ascending": False,
            "description": "Q1 在 21 个隐藏任务上的目标达成率"
          },
          "q2_goal_success_rate": {
            "sort_ascending": False,
            "description": "Q2 在 21 个隐藏任务上的目标达成率"
          }
        }
      }

