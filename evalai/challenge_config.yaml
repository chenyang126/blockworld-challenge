# ── EvalAI Challenge Configuration ──────────────────────────────────
# Blocksworld LLM Planning Challenge
#
# 使用方法：
# 1. Fork 此仓库
# 2. 配置 GitHub Secrets: AUTH_TOKEN
# 3. 修改 host_config.json 填入 EvalAI 认证信息
# 4. 推送到 challenge 分支
# 5. EvalAI 自动创建/更新 Challenge

# ── 基本信息 ────────────────────────────────────────────────────────
title: 基于大语言模型的 Blocksworld 任务规划
short_description: |
  使用大语言模型完成经典积木世界 Blocksworld 的自动规划任务。
  包含纯 LLM Prompt 规划和 LLM + PDDL 规划器两种方法。
description: |
  # 赛题背景

  Blocksworld 是 AI 规划领域的经典问题：给定若干积木的初始排列，
  需要通过一系列动作（PICKUP、PUTDOWN、UNSTACK、STACK）将其变换为目标排列。

  本赛题考察学生能否利用大语言模型（LLM）来解决规划问题，
  通过两种不同的方法路线：

  - **Q1 纯 LLM Prompt 规划**：通过设计 Prompt，让 LLM 直接输出动作序列
  - **Q2 LLM + PDDL 规划**：让 LLM 将任务翻译成 PDDL problem 文件，由经典规划器求解

  评测使用 21 个隐藏任务，包含结构化和纯自然语言描述两种输入格式。

evaluation_details: |
  # 评测流程

  1. 参赛者提交 `q1_llm_prompt_planner.py` 和 `q2_llm_pddl_planner.py`
  2. 评测系统使用统一的 LLM 后端（教师配置）对 21 个隐藏任务逐一评测
  3. Q1 和 Q2 分别计算成功率，综合给出机器评分（满分 55 分）
  4. 剩余 45 分（接口规范 15 + 实验分析 20 + 报告 10）由教师人工评定

  # 任务分布

  | 层级 | 数量 | 积木数 | 类型 |
  |------|:---:|:---:|------|
  | Hidden | 3 | 4-5 | 纯自然语言 |
  | Hard | 3 | 6-7 | 纯自然语言 |
  | Extreme | 10 | 5-9 | 纯自然语言 |
  | NL-only | 5 | 3-7 | 纯自然语言 |

# ── 评测配置 ────────────────────────────────────────────────────────
submission_guidelines: |
  # 提交要求

  请提交以下两个文件（放在一个 zip 包中）：

  1. `q1_llm_prompt_planner.py`
  2. `q2_llm_pddl_planner.py`

  文件必须实现指定的函数接口（详见开发指南）。

  代码限制：
  - 不能使用 BFS/DFS/A* 等搜索算法（Q1）
  - 不能修改 domain.pddl（Q2）
  - 不能根据 task_id 硬编码答案
  - Q1 不能调用 PDDL 规划器
  - Q2 必须调用 PDDL 规划器（pyperplan）

